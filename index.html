<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fediverse List Extractor // Terminal v2.0</title>
  <meta name="description" content="Mastodon / Misskey のフォロー中・フォロワーリストを抽出するハッカー風CLIインターフェース">

  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#050805">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FediExtract">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- CRT Scanline Effect Overlay -->
  <div class="scanlines"></div>

  <div class="app-shell">

    <header class="app-header">
      <div class="terminal-prompt">
        <span class="prompt-user">root@fediverse</span>:<span class="prompt-path">~#</span> <span class="blink-cursor">_</span>
      </div>
      <h1>FEDI_LIST_EXTRACTOR</h1>
      <p class="app-subtitle">[SYSTEM]: Target Fediverse network node & extract relationship graphs.</p>
    </header>

    <div id="offlineBanner" class="offline-banner" hidden>
      [WARNING]: Offline mode detected. Running on cached local shell.
    </div>

    <div class="card terminal-window">
      <div class="window-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="window-title">bash - 80x24</span>
      </div>

      <div class="window-body">
        <div class="field-row">
          <div class="form-group">
            <label for="platform">> PLATFORM_TYPE</label>
            <select id="platform">
              <option value="mastodon">Mastodon Protocol</option>
              <option value="misskey">Misskey Protocol</option>
            </select>
          </div>

          <div class="form-group">
            <label for="listType">> TARGET_RELATION</label>
            <select id="listType">
              <option value="following">Following [outbound]</option>
              <option value="followers">Followers [inbound]</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="form-group">
            <label for="server">> INSTANCE_HOST</label>
            <input type="text" id="server" placeholder="mastodon.social" autocomplete="off" spellcheck="false" inputmode="url">
          </div>

          <div class="form-group">
            <label for="username">> TARGET_USER</label>
            <input type="text" id="username" placeholder="username" autocomplete="off" spellcheck="false">
          </div>
        </div>

        <div class="form-group">
          <label for="token">> ACCESS_TOKEN [OPTIONAL]</label>
          <input type="password" id="token" placeholder="••••••••••••••••" autocomplete="off" spellcheck="false">
          <small class="hint">// Token remains strictly client-side. Zero telemetry transmission.</small>
        </div>

        <div class="btn-group">
          <button id="fetchBtn" class="btn-primary">[EXECUTE_FETCH]</button>
          <button id="cancelBtn" class="btn-danger" style="display:none;">[ABORT_PROCESS]</button>
        </div>

        <div class="progress-bar-outer" id="progressBarOuter">
          <div class="progress-bar-inner" id="progressBarInner"></div>
        </div>
        <div id="status"></div>

        <textarea id="output" readonly spellcheck="false" placeholder="// Extracted output stream will display here..."></textarea>

        <div class="btn-group">
          <button id="copyBtn" style="display:none;">[COPY_JSON]</button>
          <button id="downloadBtn" class="btn-success" style="display:none;">[EXPORT_JSON]</button>
          <button id="downloadCsvBtn" class="btn-secondary" style="display:none;">[EXPORT_CSV]</button>
        </div>
      </div>

    </div>

    <footer class="app-footer">
      <span id="pwaStatus">STATUS: READY</span> | <button id="pwaInstallBtn" class="pwa-install-btn" style="display:none;">[INSTALL_PWA_APP]</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
