<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fediverse フォロー一覧 JSON取得ツール</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #333; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: .3rem; font-weight: bold; }
    input, select, button, textarea { width: 100%; padding: 0.6rem; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
    button { background: #0066cc; color: #fff; border: none; cursor: pointer; font-size: 1rem; font-weight: bold; margin-top: 0.5rem; }
    button:hover { background: #004b99; }
    button.btn-success { background: #28a745; }
    button.btn-success:hover { background: #218838; }
    .btn-group { display: flex; gap: 10px; margin-top: 0.5rem; }
    textarea { height: 300px; margin-top: 1rem; font-family: monospace; font-size: 0.9rem; background: #f8f9fa; }
  </style>
</head>
<body>
  <h2>Fediverse フォロー一覧 JSON取得ツール</h2>
  
  <div class="form-group">
    <label for="platform">プラットフォーム</label>
    <select id="platform">
      <option value="misskey">Misskey (または Calckey / Firefish)</option>
      <option value="mastodon">Mastodon</option>
    </select>
  </div>

  <div class="form-group">
    <label for="server">サーバーのドメイン (例: misskey.io または mastodon.social)</label>
    <input type="text" id="server" placeholder="misskey.io">
  </div>

  <div class="form-group">
    <label for="username">取得対象のユーザー名 (例: a または a@misskey.io)</label>
    <input type="text" id="username" placeholder="空欄の場合はトークン所有者自身の情報を取得">
  </div>

  <div class="form-group">
    <label for="token">アクセストークン (※非公開アカウント取得時、またはMastodon制限回避用)</label>
    <input type="password" id="token" placeholder="アクセストークンを入力">
  </div>

  <button id="fetchBtn">フォロー一覧を取得</button>

  <textarea id="output" readonly placeholder="ここにJSONデータが出力されます"></textarea>
  
  <div class="btn-group">
    <button id="copyBtn" style="display:none;">JSONをコピー</button>
    <button id="downloadBtn" class="btn-success" style="display:none;">.json ファイルをダウンロード</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
