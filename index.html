<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title></title>
  <link rel="icon" href="/image/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="/image/icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#050805">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FediExtract">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines"></div>

  <div class="app-shell">

    <header class="app-header">
      <div class="terminal-prompt">
      </div>
      <h1>FEDIVERSE_LIST</h1>
      <p class="app-subtitle">Fediverseネットワークノードに接続し、フォロー/フォロワー関係を抽出します。</p>
    </header>

    <div id="offlineBanner" class="offline-banner" hidden>
    </div>

    <div class="card terminal-window">
      <div class="window-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>

      <div class="window-body">
        <div class="field-row">
          <div class="form-group">
            <label for="platform">> プラットフォーム</label>
            <select id="platform">
              <option value="mastodon">Mastodon</option>
              <option value="misskey">Misskey</option>
            </select>
          </div>

          <div class="form-group">
            <label for="listType">> 取得対象</label>
            <select id="listType">
              <option value="following">フォロー中</option>
              <option value="followers">フォロワー</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="form-group">
            <label for="server">> インスタンス</label>
            <input type="text" id="server" placeholder="mastodon.social" autocomplete="off" spellcheck="false" inputmode="url">
          </div>

          <div class="form-group">
            <label for="username">> ユーザー名</label>
            <input type="text" id="username" placeholder="username" autocomplete="off" spellcheck="false">
          </div>
        </div>

        <div class="form-group">
          <label for="token">> アクセストークン [任意]</label>
          <input type="password" id="token" placeholder="" autocomplete="off" spellcheck="false">
        </div>

        <div class="btn-group">
          <button id="fetchBtn" class="btn-primary">実行</button>
          <button id="cancelBtn" class="btn-danger" style="display:none;">中断</button>
        </div>

        <div class="progress-bar-outer" id="progressBarOuter">
          <div class="progress-bar-inner" id="progressBarInner"></div>
        </div>
        <div id="status"></div>

        <textarea id="output" readonly spellcheck="false" placeholder="// 抽出結果がここに表示されます..."></textarea>

        <div class="btn-group">
          <button id="copyBtn" style="display:none;">[JSONをコピー]</button>
          <button id="downloadBtn" class="btn-success" style="display:none;">[JSON出力]</button>
          <button id="downloadCsvBtn" class="btn-secondary" style="display:none;">[CSV出力]</button>
        </div>
      </div>

    </div>

    <footer class="app-footer">
      <span id="pwaStatus"></span> - <button id="pwaInstallBtn" class="pwa-install-btn" style="display:none;">[アプリをインストール]</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
